<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopSphere Seller Portal</title><link rel="stylesheet" href="/style.css"></head><body><div class="top">ShopSphere Seller Centre</div><header><a class="logo" href="/">Shop<span>Sphere</span></a><div style="flex:1"></div><button class="headBtn" onclick="logout()">Logout</button></header><main class="section"><div id="loginPanel"></div><div id="dashboard" style="display:none"><h1>Seller Dashboard</h1><div class="benefits" id="stats"></div><div style="background:#fff;padding:20px;border-radius:10px;margin-top:20px"><h2>Add Product</h2><form id="productForm" onsubmit="addProduct(event)"><div class="field"><label>Product name</label><input id="pName" required></div><div class="field"><label>Description</label><textarea id="pDesc"></textarea></div><div class="field"><label>Category</label><select id="pCat"><option>Electronics</option><option>Fashion</option><option>Appliances</option><option>Home</option><option>Beauty</option><option>Toys</option></select></div><div class="field"><label>Price</label><input id="pPrice" type="number" min="0" required></div><div class="field"><label>Old price</label><input id="pOld" type="number" min="0"></div><div class="field"><label>Stock</label><input id="pStock" type="number" min="0" required></div><div class="field"><label>Product image</label><input id="pImage" type="file" accept="image/*"></div><button class="primary">Publish Product</button></form></div><h2>My Products</h2><div class="grid" id="myProducts"></div><h2>Customer Orders</h2><div id="sellerOrders"></div></div></main><script src="/seller.js"></script></body></html>
